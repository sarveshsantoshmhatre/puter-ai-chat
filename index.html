<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A polished Markdown-first AI chat app powered by Puter.js.">
<title>Puter AI Chat</title>
<link rel="stylesheet" href="style.css">
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/highlight.min.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">✦</div><div><h1>Puter AI Chat</h1><span>Markdown-first assistant</span></div></div>
    <button id="newChatBtn" class="new-chat" type="button"><span>＋</span> New chat</button>
    <div class="sidebar-section"><div class="section-label">Model</div><select id="modelSelect" aria-label="AI model"><option value="gpt-5.6-luna">GPT-5.6 Luna</option><option value="gpt-5.5">GPT-5.5</option><option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option><option value="claude-sonnet-4-5">Claude Sonnet 4.5</option></select></div>
    <div class="sidebar-section"><div class="section-label">Workspace</div><div class="feature-list"><span>Rich Markdown rendering</span><span>Syntax-highlighted code</span><span>Copy code &amp; responses</span><span>Streaming responses</span><span>Local chat history</span></div></div>
    <div class="sidebar-footer"><a href="https://developer.puter.com" target="_blank" rel="noreferrer">Powered by Puter.js</a></div>
  </aside>
  <main class="chat-panel">
    <header class="topbar"><div class="title-wrap"><div class="eyebrow">AI ASSISTANT</div><h2 id="chatTitle">New conversation</h2></div><div class="top-actions"><button id="clearBtn" class="ghost-btn" type="button">Clear chat</button></div></header>
    <section id="messages" class="messages" aria-live="polite"></section>
    <div class="composer-wrap">
      <div class="suggestions" id="suggestions"><button type="button" data-prompt="Explain gradient descent in simple terms with an example.">Explain gradient descent</button><button type="button" data-prompt="Create a study plan for machine learning in Markdown.">Create a study plan</button><button type="button" data-prompt="Write a Python example and explain each part.">Python example</button></div>
      <form id="chatForm" class="composer"><textarea id="promptInput" rows="1" placeholder="Message the AI..." aria-label="Message"></textarea><button id="sendBtn" class="send-btn" type="submit"><span>Send</span><span class="send-icon">↑</span></button></form>
      <div class="composer-note">Enter to send · Shift+Enter for a new line · Responses support Markdown</div>
    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
